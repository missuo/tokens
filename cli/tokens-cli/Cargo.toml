[package]
name = "tokens-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for tokens - AI token usage analytics"

[[bin]]
name = "tokens"
path = "src/main.rs"

[dependencies]
tokens-core = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
iana-time-zone = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
fs2 = { workspace = true }
hostname = "0.4"
uuid = { version = "1.0", features = ["v4"] }
rpassword = "7.0"
sha2 = "0.10"
csv = "1.3"

# Trae iCubeAuthInfo decryption (Electron globalStorage)
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }

# Native TLS per target, matching tokens-core. macOS and Windows use the
# platform stack (Security.framework / schannel); every Linux target vendors
# OpenSSL because the cross builds have no usable system copy and the
# published binary must not depend on the build host's libssl soname.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["native-tls-vendored"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
serial_test = "3.0"
