<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tokens">
  <title>Tokens</title>
  <!--
    A T built from a measuring column: the crossbar is the baseline, and the
    stem is four rungs that grow shorter as they rise, the way a tally reads
    when you stack it. Says the brand letter and what the product does in one
    shape, and stays legible once the rungs collapse at small sizes.

    Drawn with currentColor on a transparent field so one file serves the
    header, the favicon, and any surface either theme puts behind it.
  -->
  <g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M14 15h36" />
    <path d="M32 15v34" />
    <path d="M22 27h20" opacity="0.75" />
    <path d="M24.5 37h15" opacity="0.5" />
    <path d="M27 47h10" opacity="0.3" />
  </g>
</svg>
