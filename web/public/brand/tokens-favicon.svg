<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tokens">
  <title>Tokens</title>
  <!--
    The blue tile: the same T-as-measuring-column mark, white on the brand
    field, matching tokens-app-icon-*.png and the PNG favicons.

    This file is the SVG favicon, and browsers that support one prefer it over
    every PNG below it in the list, so it has to carry the colour itself. The
    monochrome currentColor drawing (tokens-mark.svg) renders black on a
    transparent field when a browser loads it standalone — which is why the tab
    icon did not match the PNG fallbacks it sat above.
  -->
  <rect width="64" height="64" rx="14" fill="#2F6FDB" />
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M14 15h36" />
    <path d="M32 15v34" />
    <path d="M22 27h20" opacity="0.75" />
    <path d="M24.5 37h15" opacity="0.5" />
    <path d="M27 47h10" opacity="0.3" />
  </g>
</svg>
