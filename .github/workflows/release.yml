name: Release

# Cross-compile the `tokens` CLI for every supported target and publish the
# archives (plus SHA-256 checksums) to a GitHub Release whenever a `v*` tag is
# pushed. Re-run individual jobs from the Actions UI if a single target fails.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — native arm64 + x86_64 runners
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          # Linux — native x86_64 + cross-compiled arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Builds `cargo build --release --bin tokens --target <target>` (using
      # `cross` automatically for targets that need it, e.g. aarch64 Linux),
      # archives the binary as a .tar.gz, and uploads it to the Release for the
      # pushed tag (creating the Release if it does not exist yet).
      - name: Build and publish binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tokens
          target: ${{ matrix.target }}
          archive: tokens-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
