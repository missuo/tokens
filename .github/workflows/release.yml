name: Release

# Cross-compile the `tokens` CLI for every supported target and publish the
# archives (plus SHA-256 checksums) to a GitHub Release whenever a `v*` tag is
# pushed. Re-run individual jobs from the Actions UI if a single target fails.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Create the GitHub Release first so the per-target build jobs have something
  # to upload to (the upload action attaches to an existing release, it does not
  # create one — without this, parallel jobs fail with "release not found").
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  upload:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — native arm64 + x86_64 runners
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          # Linux — native x86_64 + cross-compiled arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Builds `cargo build --release --bin tokens --target <target>` (using
      # `cross` automatically for targets that need it, e.g. aarch64 Linux),
      # archives the binary as a .tar.gz, and uploads it to the Release created
      # by the create-release job above.
      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tokens
          target: ${{ matrix.target }}
          archive: tokens-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
