name: Publish

run-name: "release ${{ inputs.version }}"

# Build the CLI for every platform, then publish it to npm and to a GitHub
# Release. That is the whole pipeline.
#
# The previous version of this file had seven jobs and eight helper scripts,
# most of them gates checking the release *process* rather than the artifact.
# Across five attempts at 27.0.0 all eight targets compiled every single time,
# and four of the five failures were gates rejecting the pipeline's own shape:
# a meta-check asserting a job existed, a smoke test demanding a sidecar from a
# deleted feature, the same smoke test passing a deleted flag, and a provenance
# check refusing a tag that pointed one commit behind HEAD. None of them ever
# caught a broken binary.
#
# Version coherence is not checked here because it cannot drift: set-version.sh
# writes the Cargo workspace, the launcher and all eight platform packages from
# one argument in one pass.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 27.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target means a release that cannot be published, so stop the
      # rest instead of burning 40 runner-minutes to arrive at the same answer.
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin,        os: macos-latest,   pkg: cli-darwin-arm64,     bin: tokens }
          - { target: x86_64-apple-darwin,         os: macos-latest,   pkg: cli-darwin-x64,       bin: tokens }
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-latest,  pkg: cli-linux-x64-gnu,    bin: tokens, zig: true }
          - { target: x86_64-unknown-linux-musl,   os: ubuntu-latest,  pkg: cli-linux-x64-musl,   bin: tokens, zig: true }
          - { target: aarch64-unknown-linux-gnu,   os: ubuntu-latest,  pkg: cli-linux-arm64-gnu,  bin: tokens, zig: true }
          - { target: aarch64-unknown-linux-musl,  os: ubuntu-latest,  pkg: cli-linux-arm64-musl, bin: tokens, zig: true }
          - { target: x86_64-pc-windows-msvc,      os: windows-latest, pkg: cli-win32-x64-msvc,   bin: tokens.exe }
          - { target: aarch64-pc-windows-msvc,     os: windows-latest, pkg: cli-win32-arm64-msvc, bin: tokens.exe }

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/target/
          key: cli-${{ matrix.target }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: cli-${{ matrix.target }}-

      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild

      - name: Set version
        shell: bash
        run: bash scripts/set-version.sh "${{ inputs.version }}"

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            CARGO="cargo zigbuild"
          else
            CARGO="cargo"
          fi
          $CARGO build --release --manifest-path cli/Cargo.toml -p tokens-cli --target ${{ matrix.target }}

      - name: Strip
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="cli/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-*)
              sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
              aarch64-linux-gnu-strip "$BIN" ;;
            *-apple-darwin) strip -x "$BIN" ;;
            *)              strip "$BIN" ;;
          esac

      # The one check worth keeping: does the thing we are about to ship run,
      # and does it say the version we asked for? Only on the natively runnable
      # targets — the rest are cross-compiled and cannot execute here.
      - name: Verify
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(cli/target/${{ matrix.target }}/release/${{ matrix.bin }} --version)"
          echo "$OUT"
          [ "$OUT" = "tokens ${{ inputs.version }}" ] || { echo "expected 'tokens ${{ inputs.version }}'" >&2; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}
          path: cli/target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Set version
        run: bash scripts/set-version.sh "${{ inputs.version }}"

      - name: Stage binaries into their packages
        run: |
          set -euo pipefail
          for dir in artifacts/cli-*; do
            pkg="$(basename "$dir")"
            mkdir -p "packages/${pkg}/bin"
            cp "$dir"/* "packages/${pkg}/bin/"
            chmod +x "packages/${pkg}/bin/"*
            echo "staged ${pkg}: $(ls "packages/${pkg}/bin")"
          done

      # The launcher is a tsc build over two devDependencies. Deliberately not
      # --frozen-lockfile: bun installs the whole workspace, so a stale bun.lock
      # caused by an unrelated web change would otherwise fail a CLI release
      # after all eight targets had already been built.
      - name: Build the launcher
        run: |
          bun install
          bun run --cwd packages/cli build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # A prerelease must never land on the `latest` dist-tag, or every
          # plain `npm i tokens-cli` would pull it.
          V="${{ inputs.version }}"
          case "$V" in
            *-*) TAG="$(echo "${V#*-}" | cut -d. -f1)" ;;
            *)   TAG=latest ;;
          esac
          echo "dist-tag: $TAG"

          # Platform packages first: the launcher pins them by exact version and
          # would install with no binary if it landed ahead of them.
          for dir in packages/cli-*; do
            (cd "$dir" && npm publish --access public --tag "$TAG")
          done
          (cd packages/cli && npm publish --access public --tag "$TAG")

      - name: Commit the version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/Cargo.toml cli/Cargo.lock packages/*/package.json
          git commit -m "chore(release): ${{ inputs.version }}" || { echo "nothing to commit"; exit 0; }
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # pkg:target. A plain list rather than an associative array so the
          # same snippet runs under bash 3.2 and can be rehearsed locally.
          PAIRS="
            cli-darwin-arm64:aarch64-apple-darwin
            cli-darwin-x64:x86_64-apple-darwin
            cli-linux-x64-gnu:x86_64-unknown-linux-gnu
            cli-linux-x64-musl:x86_64-unknown-linux-musl
            cli-linux-arm64-gnu:aarch64-unknown-linux-gnu
            cli-linux-arm64-musl:aarch64-unknown-linux-musl
            cli-win32-x64-msvc:x86_64-pc-windows-msvc
            cli-win32-arm64-msvc:aarch64-pc-windows-msvc
          "
          # Archive layout is a bare binary at the root, matching every release
          # since 3.x — install.sh and the Homebrew tap depend on it.
          mkdir -p dist
          for pair in $PAIRS; do
            pkg="${pair%%:*}"; target="${pair#*:}"
            # Name the member explicitly: `-C dir .` would add a leading `./`
            # that previous releases do not have.
            tar czf "dist/tokens-v${{ inputs.version }}-${target}.tar.gz" \
              -C "artifacts/$pkg" "$(ls "artifacts/$pkg")"
          done
          ls -la dist

          PRERELEASE=""
          case "${{ inputs.version }}" in *-*) PRERELEASE="--prerelease" ;; esac

          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            $PRERELEASE \
            dist/*.tar.gz
